<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Three.js Glowing Glass Icon Demo</title>
    <style>body{margin:0;background:#050510}canvas{display:block}</style>
  </head>
  <body>
    <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.152.2/examples/js/controls/OrbitControls.js"></script>
    <script>
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 1000);
      camera.position.z = 4;
      const renderer = new THREE.WebGLRenderer({antialias:true});
      renderer.setSize(innerWidth, innerHeight);
      document.body.appendChild(renderer.domElement);
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      // hex-like honeycomb background
      const geo = new THREE.IcosahedronGeometry(1.2, 4);
      const mat = new THREE.MeshPhysicalMaterial({
        color: 0x88ccff, metalness:0.2, roughness:0.1, transmission:0.6, clearcoat:0.4
      });
      const mesh = new THREE.Mesh(geo, mat);
      scene.add(mesh);
      const light = new THREE.PointLight(0xffffff, 1.2);
      light.position.set(5,5,5);
      scene.add(light);
      const amb = new THREE.AmbientLight(0x111122);
      scene.add(amb);
      function animate(){
        requestAnimationFrame(animate);
        mesh.rotation.y += 0.008;
        mesh.rotation.x += 0.004;
        renderer.render(scene,camera);
      }
      animate();
    </script>
  </body>
</html>
