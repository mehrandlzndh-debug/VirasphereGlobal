version: "3.8"
services:
  web:
    build: ./packages/web-nextjs-owner
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - api
    restart: always
  api:
    build: ./packages/api-nestjs
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
      - redis
    restart: always
  ai:
    build: ./packages/ai-fastapi
    ports:
      - "8500:8500"
    env_file: .env
    restart: on-failure
  worker:
    build: ./packages/worker
    env_file: .env
    command: npm run start:worker
    depends_on:
      - api
      - redis
    restart: on-failure
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
  redis:
    image: redis:7
    volumes:
      - redis-data:/data
volumes:
  db-data:
  redis-data:
